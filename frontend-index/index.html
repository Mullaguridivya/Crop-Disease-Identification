<!DOCTYPE html>
<html>
<head>
    <title>Crop disease identification using leaf image</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 50px; }
        img { margin-top: 20px; width: 300px; }
    </style>
</head>
<body>

<h2>Crop disease identification using leaf image</h2>

<form method="POST" enctype="multipart/form-data">
    <input type="file" name="image" accept="image/*" required>
    <br><br>
    <button type="submit">Predict</button>
</form>

{% if img_path %}
    <img src="{{ img_path }}">
{% endif %}

{% if prediction %}
    <h3>Expression: {{ prediction }}</h3>
    <p>Confidence: {{ confidence }}%</p>
{% endif %}

</body>
</html>
